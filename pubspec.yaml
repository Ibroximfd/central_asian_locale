name: central_asian_locale
description: >
  Complete localization for Uzbek (Latin & Cyrillic), Kazakh, Tajik,
  and Kyrgyz. Date, time, number, currency formatting with Hijri calendar.
version: 0.1.0
homepage: https://github.com/ibroximfd/central_asian_locale
repository: https://github.com/ibroximfd/central_asian_locale

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.18.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: "^3.0.0"
  test: "^1.24.0"

flutter:
  generate: true
